server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩（JS/CSS 体积能降 60%+）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 前端路由 ----------
    # SPA 回落：/ai-brain、/sales/order 这些路径在磁盘上没有对应文件，
    # 必须交给 index.html 由 vue-router 处理，否则刷新就 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Java 后端 ----------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---------- AI 服务（FastAPI） ----------
    # 🔴 必须写 `location /ai/`（带斜杠），**不能写 `location /ai`**。
    #    location 是按前缀匹配的：`/ai` 会把前端路由 `/ai-brain` 一起吃掉，
    #    直接打开或刷新 /ai-brain 会返回 FastAPI 的 {"detail":"Not Found"}。
    #    （vite.config.ts 里踩过一模一样的坑，那边是靠 `'^/ai/'` 正则解决的）
    location /ai/ {
        proxy_pass http://ai:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SSE 流式（知识库问答 / 智能问数）必须关缓冲，
        # 否则 Nginx 会把事件攒成一坨再发，打字机效果和进度条全废。
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        # 图片识别（视觉 + 文本两跳）实测 20s，留足余量
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
